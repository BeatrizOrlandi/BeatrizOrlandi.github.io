<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Feature Engineering Causal, Validação Temporal e Monitoramento de Drift">
  <rect width="800" height="340" rx="8" fill="#143533"/>
  <text x="32" y="40" fill="#e8c996" font-family="Consolas, monospace" font-size="12" letter-spacing="1.4">MLOPS &amp; SÉRIES TEMPORAIS · FEATURE ENGINEERING CAUSAL, SPLIT TEMPORAL &amp; DRIFT</text>

  <rect x="32" y="74" width="230" height="200" rx="6" fill="#1a403d" stroke="#e8c996" stroke-width="1.5"/>
  <text x="50" y="102" fill="#e8c996" font-family="Consolas, monospace" font-size="11" font-weight="bold">01 / PREVENÇÃO DE LEAKAGE</text>
  <text x="50" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Features Estritamente Causais</text>
  <text x="50" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Corte por availability_time</text>
  <text x="50" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Lags Seguros (t-2h, t-24h, t-168h)</text>
  <text x="50" y="204" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Exclusão de Variáveis Futuras</text>
  <text x="50" y="226" fill="#5ce0a8" font-family="Consolas, monospace" font-size="11">• Codificação Cíclica (Sen/Cos)</text>

  <path d="M266 174 L292 174" stroke="#e8c996" stroke-width="2"/>
  <polygon points="292,169 300,174 292,179" fill="#e8c996"/>

  <rect x="304" y="74" width="225" height="200" rx="6" fill="#122f2d" stroke="#5ce0a8" stroke-width="1.5"/>
  <text x="322" y="102" fill="#5ce0a8" font-family="Consolas, monospace" font-size="11" font-weight="bold">02 / VALIDAÇÃO &amp; REGISTRY</text>
  <text x="322" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Governança de Modelos</text>
  <text x="322" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Split Cronológico Estrito</text>
  <text x="322" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Comparação vs Baseline Sazonal</text>
  <text x="322" y="204" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Gate de Promoção (@challenger)</text>
  <text x="322" y="226" fill="#e8c996" font-family="Consolas, monospace" font-size="11">• Assinatura de Schema no Registry</text>

  <path d="M533 174 L559 174" stroke="#5ce0a8" stroke-width="2"/>
  <polygon points="559,169 567,174 559,179" fill="#5ce0a8"/>

  <rect x="571" y="74" width="197" height="200" rx="6" fill="#1a403d" stroke="#9ab3a8" stroke-width="1.5"/>
  <text x="589" y="102" fill="#e8c996" font-family="Consolas, monospace" font-size="11" font-weight="bold">03 / MONITORAMENTO</text>
  <text x="589" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Observabilidade Pós-Deploy</text>
  <text x="589" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Erro por Faixa Horária</text>
  <text x="589" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Acompanhamento de Resíduos</text>
  <text x="589" y="204" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Detecção de Drift Sazonal</text>
  <text x="589" y="226" fill="#5ce0a8" font-family="Consolas, monospace" font-size="11">• Gatilho de Retreino</text>

  <text x="32" y="312" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">Reprodução fiel da disponibilidade de dados no instante da decisão para evitar otimismo artificial em produção.</text>
