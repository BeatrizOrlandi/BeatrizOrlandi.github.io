  <text x="258" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Vetorial + Lexical</text>
  <text x="258" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Embeddings Densos (ANN)</text>
  <text x="258" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Match Exato (BM25/TF-IDF)</text>
  <text x="258" y="204" fill="#e8c996" font-family="Consolas, monospace" font-size="11">• Filtro Pré-Recuperação</text>
  <text x="258" y="226" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Prevenção Cross-Tenant</text>

  <path d="M426 174 L450 174" stroke="#e8c996" stroke-width="2"/>
  <polygon points="450,169 458,174 450,179" fill="#e8c996"/>

  <rect x="462" y="74" width="150" height="200" rx="6" fill="#1a403d" stroke="#e8c996" stroke-width="1.5"/>
  <text x="478" y="102" fill="#e8c996" font-family="Consolas, monospace" font-size="11" font-weight="bold">03 / RE-RANK &amp; GATE</text>
  <text x="478" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Pós-Verificação</text>
  <text x="478" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Re-ranking Top-K</text>
  <text x="478" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Checagem de Vigência</text>
  <text x="478" y="204" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Limiar de Abstenção</text>

  <path d="M616 174 L640 174" stroke="#5ce0a8" stroke-width="2"/>
  <polygon points="640,169 648,174 640,179" fill="#5ce0a8"/>

  <rect x="652" y="74" width="116" height="200" rx="6" fill="#122f2d" stroke="#5ce0a8" stroke-width="1.5"/>
  <text x="664" y="102" fill="#5ce0a8" font-family="Consolas, monospace" font-size="10" font-weight="bold">04 / GROUNDING</text>
  <text x="664" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold">Citação Estrita</text>
  <text x="664" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="10">• ID + Versão</text>
