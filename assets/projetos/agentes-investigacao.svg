  <text x="253" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Consulta Indicadores</text>
  <text x="253" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Busca Normas (RAG)</text>
