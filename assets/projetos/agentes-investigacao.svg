  <text x="48" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Intenção &amp; Escopo</text>
  <text x="48" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Valida Permissão</text>
  <text x="48" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Detecta Ambiguidade</text>
  <text x="48" y="204" fill="#f2a68d" font-family="Consolas, monospace" font-size="11">• Barra SQL Injection</text>
  <text x="48" y="226" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Define Orçamento</text>

