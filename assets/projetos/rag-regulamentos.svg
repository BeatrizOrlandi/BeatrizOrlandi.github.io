<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Arquitetura RAG: Indexação Incremental, Busca Híbrida, Filtragem de Governança e Re-ranking">
  <rect width="800" height="340" rx="8" fill="#143533"/>
  <text x="32" y="40" fill="#e8c996" font-family="Consolas, monospace" font-size="12" letter-spacing="1.4">PIPELINE RAG · INDEXAÇÃO INCREMENTAL, BUSCA HÍBRIDA, FILTROS &amp; RE-RANKING</text>

  <rect x="32" y="74" width="170" height="200" rx="6" fill="#1a403d" stroke="#9ab3a8" stroke-width="1.5"/>
  <text x="48" y="102" fill="#e8c996" font-family="Consolas, monospace" font-size="11" font-weight="bold">01 / INDEXAÇÃO &amp; CDF</text>
  <text x="48" y="130" fill="#fffef9" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold">Chunking Semântico</text>
  <text x="48" y="160" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Metadados de Escopo</text>
  <text x="48" y="182" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Janela de Vigência</text>
  <text x="48" y="204" fill="#bfd0c5" font-family="Consolas, monospace" font-size="11">• Delta Change Data Feed</text>
  <text x="48" y="226" fill="#5ce0a8" font-family="Consolas, monospace" font-size="11">• Sync Incremental</text>

  <path d="M206 174 L230 174" stroke="#e8c996" stroke-width="2"/>
  <polygon points="230,169 238,174 230,179" fill="#e8c996"/>

  <rect x="242" y="74" width="180" height="200" rx="6" fill="#122f2d" stroke="#5ce0a8" stroke-width="1.5"/>
